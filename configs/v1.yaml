# V1 - RAG: thêm Retrieval Agent (MedRAG textbooks qua Chroma) trước
# Reasoning Agent. Đây là biến thể để so sánh với v0 (accuracy gain của
# retrieval), theo đúng ablation study trong project-plan.
variant: "v1"
prompt_version: "v1_rag"
temperature: 0.0
seed: null

# Giữ nguyên {question} và {choices} như v0. Thêm {evidence} - được
# Reasoning Agent tự động điền từ state["retrieved_docs"] (do Retrieval
# Agent ghi vào, chạy trước trong graph). Nếu evidence rỗng hoặc lỗi,
# {evidence} sẽ là "No retrieved evidence." và model được dặn tự suy luận.
prompt_template: |
  Use the retrieved evidence below if it is relevant to the question.
  If the evidence is irrelevant or conflicting, ignore it and answer from
  your own medical knowledge instead.

  Retrieved evidence:
  {evidence}

  Question:
  {question}

  Choices:
  {choices}

  Answer this question carefully and choose ONE best answer.
  Only return JSON in the following format, do not add any other text outside the JSON:
  {{
    "answer": "A or B or C or D",
    "explanation": "explanation about the answer",
    "confidence": confidence from 0 to 1
  }}

retrieval:
  enabled: true
  top_k: 5

verifier:
  enabled: false

pricing:
  input_per_1k: null
  output_per_1k: null
