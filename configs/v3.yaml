# V3 - Multi-agent with Memory
# Kế thừa v2 (Retrieval self-retry + Verifier) + thêm Memory system
# (Short-term: conversation context, Long-term: QA cache & analytics)

variant: "v3"
prompt_version: "v3_rag_verified_with_memory"
temperature: 0.0
seed: null
debug: true

# Prompt cho Reasoning Agent - giống v2
prompt_template: |
  Use the retrieved evidence below if it is relevant to the question.
  If the evidence is irrelevant or conflicting, ignore it and answer from
  your own medical knowledge instead.

  Retrieved evidence:
  {evidence}

  Question:
  {question}

  Choices:
  {choices}

  Answer this question carefully and choose ONE best answer.
  Only return JSON in the following format, do not add any other text outside the JSON:
  {{
    "answer": "A or B or C or D",
    "explanation": "explanation about the answer",
    "confidence": confidence from 0 to 1
  }}

# Retrieval Agent - giữ nguyên từ v2
retrieval:
  enabled: true
  top_k: 5
  max_iterations: 2
  sufficiency_threshold: 0.6
  check_model: null
  prompt_template: |
    You are grading whether the retrieved evidence below is
    enough to answer a medical multiple-choice question. Be strict - only say
    sufficient=true if the evidence actually lets someone pick the right choice.

    Question:
    {question}

    Choices:
    {choices}

    Retrieved evidence so far:
    {evidence}

    Return JSON only, no other text:
    {{
      "sufficient": true or false,
      "sufficiency_score": confidence from 0 to 1 that the evidence is enough,
      "next_query": "a reformulated, more specific search query to find the missing evidence (only used if sufficient=false)"
    }}

# Verifier Agent - giữ nguyên từ v2
verifier:
  enabled: true
  mode: "annotate_and_guard"
  model: null
  prompt_template: |
    You are a careful medical fact-checker. Your job is to
    check whether a draft answer to a medical multiple-choice question is actually
    supported by the retrieved evidence below - NOT to re-solve the question from
    scratch.

    Question:
    {question}

    Choices:
    {choices}

    Retrieved evidence:
    {evidence}

    Draft answer: {draft_answer}
    Draft explanation: {draft_explanation}

    Instructions:
    - If the evidence clearly supports the draft answer, verdict="supported".
    - If the evidence is irrelevant, missing, or too weak to confirm the draft
      answer, verdict="unsupported" - do NOT invent support that isn't there.
    - If the evidence partially supports it (e.g. supports the general topic but
      not the specific choice), verdict="partial".
    - Only change final_answer away from the draft answer if the evidence
      clearly and specifically points to a different choice. Otherwise keep
      final_answer equal to the draft answer.
    - final_confidence should be LOWER than the draft confidence when verdict is
      "unsupported" or "partial", and can stay the same or increase slightly
      when verdict is "supported".

    Return JSON only, no other text outside the JSON:
    {{
      "verdict": "supported" or "partial" or "unsupported",
      "support_score": confidence from 0 to 1 that the evidence backs the answer,
      "final_answer": "A" or "B" or "C" or "D",
      "final_explanation": "short explanation citing which evidence was used (or noting the lack of it)",
      "final_confidence": confidence from 0 to 1,
      "notes": "one short sentence on why you made this decision"
    }}

# MỚI: Memory System (v3)
memory:
  debug: true

  # Short-term Memory - Conversation context
  short_term:
    enabled: true
    max_turns: null  # null = unlimited (giữ hết session), số = sliding window
    persistence: true
    session_dir: "memory/sessions"
    auto_load_last_session: true
    follow_up_detection:
      method: "keyword"
      keywords:
        - "nó"
        - "cái đó"
        - "ở trên"
        - "trước đó"
        - "điều đó"
        - "it"
        - "this"
        - "that"
        - "above"
        - "previous"
        - "earlier"

  # Long-term Memory - QA cache & Analytics
  long_term:
    enabled: true
    qa_cache:
      collection_name: "qa_cache"
      chroma_dir: "data/chroma"
      min_confidence: 0.8
      min_verifier_verdict: "supported"
      similarity_threshold: 0.85
      embedding_model: null
      max_cache_size: 1000
      cache_eviction_policy: "lru"
    analytics:
      enabled: false  # Phase 4 sẽ bật
      db_path: "memory/analytics.db"
      log_all_questions: true

pricing:
  input_per_1k: null
  output_per_1k: null
