# V3 — V2 + Memory: STM loop-scratchpad giúp tránh lặp vòng vô ích,
# LTM read_only chứa reflection từ train split
variant: "v3"
debug: "info"
seed: null

pipeline:
  - name: retrieval
    enabled: true
    top_k: 5
    chroma_dir: "data/chroma/medrag_textbooks_bge_m3_openrouter"           # đổi thành path thật nếu collection nằm chỗ khác
    collection_name: "medrag_textbooks"  # đổi thành tên collection thật của bạn

  - name: reasoning
    enabled: true
    temperature: 0.0
    prompt_template: |
      Answer this medical question using the provided evidence. Choose ONE best answer.

      Previous attempts (learn from these, do NOT repeat the same mistakes):
      {loop_history}

      Lessons from similar questions:
      {ltm_facts}

      Evidence:
      {evidence}

      Question:
      {question}

      Choices:
      {choices}

      Return JSON only:
      {{
        "answer": "A or B or C or D",
        "explanation": "brief explanation referencing the evidence",
        "confidence": 0.0 to 1.0
      }}

  - name: verifier
    enabled: true
    max_iterations: 3
    prompt_template: |
      You are a medical answer verifier. Check if the draft answer is supported by the evidence.

      Question:
      {question}

      Choices:
      {choices}

      Draft answer: {draft_answer}
      Draft explanation: {draft_explanation}

      Evidence:
      {evidence}

      Known facts about user:
      {ltm_facts}

      Evaluate whether the evidence supports the draft answer.
      If NOT supported, suggest a better search query.

      Return JSON only:
      {{
        "verdict": "supported or unsupported",
        "explanation": "why supported or not",
        "suggested_query": "new search query if unsupported, else empty string"
      }}

memory:
  short_term:
    enabled: true
    scope: "loop"            # benchmark chỉ cần loop-scratchpad
    max_items: 10

  long_term:
    enabled: true
    top_k: 3
    mode: "read_only"          # benchmark LUÔN read_only (runner cũng enforce)
    collection_name: "reflections"

pricing:
  input_per_1k: null
  output_per_1k: null
