# V2 — Multi-agent: retrieval + reasoning + verifier với autonomous loop
# CỐ Ý không có memory — để so sánh với V3 (có memory)
variant: "v2"
debug: "info"
seed: null

pipeline:
  - name: retrieval
    enabled: true
    top_k: 5
    chroma_dir: "data/chroma/medrag_textbooks_bge_m3_openrouter"           # đổi thành path thật nếu collection nằm chỗ khác
    collection_name: "medrag_textbooks"  # đổi thành tên collection thật của bạn

  - name: reasoning
    enabled: true
    temperature: 0.0
    prompt_template: |
      Answer this medical question using the provided evidence. Choose ONE best answer.

      {loop_history}

      Evidence:
      {evidence}

      Question:
      {question}

      Choices:
      {choices}

      Return JSON only:
      {{
        "answer": "A or B or C or D",
        "explanation": "brief explanation referencing the evidence",
        "confidence": 0.0 to 1.0
      }}

  - name: verifier
    enabled: true
    max_iterations: 3
    prompt_template: |
      You are a medical answer verifier. Check if the draft answer is supported by the evidence.

      Question:
      {question}

      Choices:
      {choices}

      Draft answer: {draft_answer}
      Draft explanation: {draft_explanation}

      Evidence:
      {evidence}

      Evaluate whether the evidence supports the draft answer.
      If NOT supported, suggest a better search query.

      Return JSON only:
      {{
        "verdict": "supported or unsupported",
        "explanation": "why supported or not",
        "suggested_query": "new search query if unsupported, else empty string"
      }}

memory:
  short_term: { enabled: false }   # V2 cố ý KHÔNG có memory
  long_term: { enabled: false }

pricing:
  input_per_1k: null
  output_per_1k: null
