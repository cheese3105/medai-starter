# V3 + Query Rewriter — so sánh trực tiếp với v3.yaml (không có rewriter)
# Pipeline: query_rewriter → retrieval → reasoning → verifier [→ query_rewriter nếu unsupported]
variant: "v3-qr"
debug: "verbose"
seed: null

pipeline:
  # query_rewriter chạy ĐẦU TIÊN mỗi iteration để sinh retrieval_query.
  # Iter 1: formulate initial query từ question gốc (evidence rỗng).
  # Iter 2+: cải thiện query dựa trên evidence thất bại + lý do reject.
  - name: query_rewriter
    enabled: true
    prompt_template: |
      You are a medical search query optimizer. Your job is to generate the best
      possible retrieval query to find evidence for answering a USMLE-style question.

      === QUESTION ===
      {question}

      === CONTEXT FROM PREVIOUS ATTEMPT (empty if first attempt) ===
      Evidence that was NOT sufficient: {evidence}
      Rejection reason: {draft_explanation}
      Previous queries tried: {loop_history}

      === TASK ===
      Generate ONE specific, keyword-rich medical search query.

      Rules:
      1. If this is the FIRST attempt (no prior evidence): distill the question into
         the core medical concept — include drug/disease name, mechanism, or finding.
         Example: "cisplatin mechanism DNA cross-linking platinum antineoplastic"
      2. If RETRYING after failure: identify what knowledge is MISSING from the
         failed evidence and write a query targeting that gap.
      3. NEVER reproduce the full original question as the query.
      4. Prefer: drug names, mechanisms, anatomical terms, eponyms, diagnostic criteria.

      Return JSON only:
      {{
        "rewritten_query": "your search query (5-15 keywords)",
        "reasoning": "1 sentence: why this query targets the right knowledge"
      }}

  - name: retrieval
    enabled: true
    top_k: 5
    chroma_dir: "data/chroma/medrag_textbooks_bge_m3_openrouter"
    collection_name: "medrag_textbooks"

  - name: reasoning
    enabled: true
    temperature: 0.0
    prompt_template: |
      Answer this medical question using the provided evidence. Choose ONE best answer.

      Previous attempts (learn from these, do NOT repeat the same mistakes):
      {loop_history}

      Lessons from similar questions:
      {ltm_facts}

      Evidence:
      {evidence}

      Question:
      {question}

      Choices:
      {choices}

      Return JSON only:
      {{
        "answer": "A or B or C or D",
        "explanation": "brief explanation referencing the evidence",
        "confidence": 0.0 to 1.0
      }}

  - name: verifier
    enabled: true
    max_iterations: 3
    prompt_template: |
      You are a medical answer verifier. Check if the draft answer is supported by the evidence.

      Question: {question}
      Choices: {choices}
      Draft answer: {draft_answer}
      Draft explanation: {draft_explanation}
      Evidence: {evidence}
      Known facts about user: {ltm_facts}

      Return JSON only:
      {{
        "verdict": "supported or unsupported",
        "final_answer": "A or B or C or D",
        "confidence": 0.0 to 1.0,
        "explanation": "why supported or not"
      }}

memory:
  short_term:
    enabled: true
    scope: "loop"
    max_items: 10

  long_term:
    enabled: true
    top_k: 3
    mode: "read_only"
    collection_name: "reflections"

pricing:
  input_per_1k: null
  output_per_1k: null
