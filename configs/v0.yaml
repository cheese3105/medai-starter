# V0 — Baseline: chỉ LLM, không RAG, không Verifier, không Memory
variant: "v0"
debug: "info"
seed: null

pipeline:
  - name: reasoning
    enabled: true
    temperature: 0.0
    prompt_template: |
      Answer this medical question. Choose ONE best answer from the given choices.

      Question:
      {question}

      Choices:
      {choices}

      Return JSON only:
      {{
        "answer": "A or B or C or D",
        "explanation": "brief explanation",
        "confidence": 0.0 to 1.0
      }}

memory:
  short_term: { enabled: false }
  long_term: { enabled: false }

pricing:
  input_per_1k: null
  output_per_1k: null
