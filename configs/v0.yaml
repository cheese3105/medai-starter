# V0 - Baseline: chỉ Reasoning Agent, không RAG, không Verifier
variant: "v0"
prompt_version: "v1"    # chỉ là nhãn để log/so sánh - không dùng để tra cứu
temperature: 0.0
seed: null

# Nội dung prompt thật - sửa trực tiếp ở đây để đổi prompt, không cần sửa code.
# Bắt buộc giữ nguyên {question} và {choices} (được điền lúc chạy),
# và giữ nguyên {{ }} quanh phần ví dụ JSON (để .format() không hiểu nhầm).
prompt_template: |
  Answer this question:

  Question:
  {question}

  Choices:
  {choices}

  Answer this question carefully and choose ONE best answer.
  Only return JSON in the following format, do not add any other text outside the JSON:
  {{
    "answer": "A or B or C or D",
    "explanation": "explanation about the answer",
    "confidence": confidence from 0 to 1
  }}

retrieval:
  enabled: false
  top_k: 5

verifier:
  enabled: false

pricing:
  input_per_1k: null
  output_per_1k: null
